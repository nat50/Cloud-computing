<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="725" viewBox="0 0 1380 725" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t  { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .tm { font-size: 16px; font-weight: 700; fill: #0f172a; font-family: Consolas, monospace; }
      .s  { font-size: 13px; fill: #475569; }
      .lb { font-size: 14px; fill: #0f172a; }
      .n  { font-weight: 700; }
      .box   { fill: #ffffff; stroke: #1e293b; stroke-width: 1.6; }
      .flow  { fill: none; stroke: #1e293b; stroke-width: 2; }
      .err   { fill: none; stroke: #c62828; stroke-width: 2; }
      .ctl   { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1380" height="725" fill="#ffffff"/>

  <!-- ===== Cloud Storage ===== -->
  <rect x="40" y="20" width="1080" height="70" rx="8" fill="#f8fafc" stroke="#1e293b" stroke-width="1.6"/>
  <text x="580" y="50" class="t" text-anchor="middle">Cloud Storage</text>
  <text x="580" y="72" class="s" text-anchor="middle" font-family="Consolas, monospace">gs://&lt;bucket&gt;/frames/*.jpg</text>

  <!-- ===== Producer ===== -->
  <rect x="40" y="185" width="180" height="70" rx="8" class="box"/>
  <text x="130" y="214" class="t" text-anchor="middle">Producer</text>
  <text x="130" y="236" class="s" text-anchor="middle">camera giả lập</text>

  <!-- ===== Pub/Sub ===== -->
  <rect x="300" y="135" width="530" height="340" rx="12" fill="#eef4ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="318" y="162" font-size="18" font-weight="700" fill="#1d4ed8">Pub/Sub</text>

  <rect x="330" y="185" width="160" height="70" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="410" y="215" class="tm" text-anchor="middle">frames</text>
  <text x="410" y="237" class="s" text-anchor="middle">topic</text>

  <rect x="570" y="185" width="220" height="70" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="680" y="215" class="tm" text-anchor="middle">frames-workers</text>
  <text x="680" y="237" class="s" text-anchor="middle">pull · ack deadline 60s</text>

  <rect x="570" y="292" width="220" height="60" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="680" y="318" class="tm" text-anchor="middle">frames-audit</text>
  <text x="680" y="339" class="s" text-anchor="middle">export → BigQuery</text>

  <rect x="640" y="390" width="150" height="60" rx="8" fill="#fff" stroke="#c62828" stroke-width="1.6"/>
  <text x="715" y="416" class="tm" text-anchor="middle">frames-dlq</text>
  <text x="715" y="437" class="s" text-anchor="middle">export → BigQuery</text>

  <!-- fan-out -->
  <path d="M490,220 H568" class="flow" marker-end="url(#a)"/>
  <path d="M530,220 V322 H568" class="flow" marker-end="url(#a)"/>
  <text x="410" y="320" class="s" text-anchor="middle">fan-out: mỗi</text>
  <text x="410" y="338" class="s" text-anchor="middle">subscription nhận</text>
  <text x="410" y="356" class="s" text-anchor="middle">1 bản sao</text>

  <!-- dead-letter -->
  <path d="M790,242 H812 V420 H792" class="err" marker-end="url(#r)"/>
  <text x="806" y="377" font-size="13" fill="#c62828" text-anchor="end">lỗi quá 5 lần</text>

  <!-- ===== GKE Autopilot ===== -->
  <rect x="880" y="135" width="480" height="150" rx="12" fill="#effaf2" stroke="#16a34a" stroke-width="1.8"/>
  <text x="898" y="162" font-size="18" font-weight="700" fill="#15803d">GKE Autopilot</text>
  <text x="1342" y="162" class="s" text-anchor="end">image từ Artifact Registry</text>

  <rect x="900" y="185" width="180" height="70" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="990" y="214" class="t" text-anchor="middle">Worker YOLO26n</text>
  <text x="990" y="236" class="s" text-anchor="middle">× N pod · ONNX · CPU</text>

  <rect x="1150" y="185" width="190" height="70" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="1245" y="214" class="t" text-anchor="middle">KEDA</text>
  <text x="1245" y="236" class="s" text-anchor="middle">scale theo backlog</text>
  <path d="M1150,220 H1084" class="ctl" marker-end="url(#g)"/>
  <text x="1117" y="210" font-size="12" fill="#64748b" text-anchor="middle">scale</text>

  <!-- ===== BigQuery ===== -->
  <rect x="300" y="505" width="1060" height="95" rx="12" fill="#fff8eb" stroke="#d97706" stroke-width="1.8"/>
  <text x="318" y="548" font-size="18" font-weight="700" fill="#b45309">BigQuery</text>
  <text x="318" y="570" class="s" font-family="Consolas, monospace">yolo_pipeline</text>

  <rect x="480" y="532" width="180" height="48" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.6"/>
  <text x="570" y="562" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Consolas, monospace">frames_published</text>

  <rect x="680" y="532" width="140" height="48" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.6"/>
  <text x="750" y="562" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Consolas, monospace">dead_letters</text>

  <rect x="890" y="532" width="150" height="48" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.6"/>
  <text x="965" y="562" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Consolas, monospace">detections</text>

  <rect x="1060" y="532" width="180" height="48" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="1150" y="553" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle" font-family="Consolas, monospace">detections_dedup</text>
  <text x="1150" y="571" font-size="12" fill="#64748b" text-anchor="middle">view · 1 dòng / frame_id</text>

  <!-- ===== Numbered main flow ===== -->
  <!-- 1 upload -->
  <path d="M130,185 V92" class="flow" marker-end="url(#a)"/>
  <text x="142" y="143" class="lb"><tspan class="n">1</tspan> upload ảnh</text>

  <!-- 2 publish -->
  <path d="M220,220 H328" class="flow" marker-end="url(#a)"/>
  <text x="260" y="210" class="lb" text-anchor="middle"><tspan class="n">2</tspan> publish</text>
  <text x="260" y="242" font-size="11" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace">frame_id,</text>
  <text x="260" y="256" font-size="11" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace">gcs_uri</text>

  <!-- 3 pull / 6 ack -->
  <path d="M790,220 H898" class="flow" marker-end="url(#a)"/>
  <text x="856" y="210" font-size="13" fill="#0f172a" text-anchor="middle"><tspan class="n">3</tspan> pull</text>
  <text x="856" y="241" font-size="13" fill="#0f172a" text-anchor="middle"><tspan class="n">6</tspan> ack</text>

  <!-- 4 download -->
  <path d="M1040,185 V92" class="flow" marker-end="url(#a)"/>
  <text x="1052" y="122" class="lb"><tspan class="n">4</tspan> tải ảnh theo gcs_uri</text>

  <!-- 5 write -->
  <path d="M965,255 V530" class="flow" marker-end="url(#a)"/>
  <text x="977" y="390" class="lb"><tspan class="n">5</tspan> ghi kết quả</text>
  <text x="977" y="409" class="s">xong mới ack (bước 6)</text>

  <!-- exports -->
  <path d="M600,352 V530" class="flow" marker-end="url(#a)"/>
  <path d="M715,450 V530" class="err" marker-end="url(#r)"/>

  <!-- ===== Footer ===== -->
  <rect x="40" y="625" width="1320" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="652" font-size="14" fill="#334155"><tspan font-weight="700" fill="#0f172a">Giám sát:</tspan>  Cloud Monitoring (backlog, số pod, CPU)  ·  Cloud Logging (log worker)</text>

  <!-- Legend -->
  <path d="M44,700 H88" class="flow" marker-end="url(#a)"/>
  <text x="96" y="705" class="s">luồng dữ liệu</text>
  <path d="M210,700 H254" class="err" marker-end="url(#r)"/>
  <text x="262" y="705" class="s">frame lỗi (dead-letter)</text>
  <path d="M430,700 H474" class="ctl" marker-end="url(#g)"/>
  <text x="482" y="705" class="s">điều khiển</text>
</svg>
